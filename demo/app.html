<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vital Sign Mapping Console</title>
<style>
  /* ------------------------------------------------------------------
     Clinical dashboard. Deliberately single-theme: a hospital console is
     a light instrument, so the page paints its own white ground rather
     than following the OS. Every colour is explicit for that reason.
     ------------------------------------------------------------------ */
  :root {
    color-scheme: light;

    --white:      #FFFFFF;
    --panel:      #F7F9FA;
    --panel-alt:  #FBFCFD;
    --line:       #E4E9EC;
    --line-firm:  #CFD8DD;

    --ink:        #141B21;
    --ink-2:      #46555F;
    --ink-3:      #6B7B85;

    /* UNSW brand yellow — used only as a 3px identity rail and the active
       nav marker. Loud colour, tiny dose. */
    --brand:      #FFDB05;

    /* institutional blue carries all interaction */
    --primary:      #0A4B82;
    --primary-ink:  #083C68;
    --primary-soft: #EAF1F7;

    --ok:        #15704A;
    --ok-soft:   #E7F2EC;
    --warn:      #8F5406;
    --warn-soft: #FBF2E3;
    --crit:      #A3231C;
    --crit-soft: #FAEBE9;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

    --r: 3px;
  }

  * { box-sizing: border-box; }

  html { background: var(--white); }
  body {
    margin: 0;
    background: var(--white);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- identity rail + masthead ---------- */
  .rail { height: 3px; background: var(--brand); }

  .masthead {
    border-bottom: 1px solid var(--line);
    background: var(--white);
    position: sticky; top: 0; z-index: 20;
  }
  .masthead-in {
    max-width: 1280px; margin: 0 auto; padding: .85rem 1.75rem;
    display: flex; align-items: center; gap: 1.1rem; flex-wrap: wrap;
  }
  #logo { height: 30px; width: auto; display: block; }
  .lockup { display: flex; align-items: center; gap: .9rem; min-width: 0; }
  .lockup-div { width: 1px; height: 28px; background: var(--line-firm); }
  .titles { min-width: 0; }
  .titles h1 {
    margin: 0; font-size: 1rem; font-weight: 700; letter-spacing: -.005em; color: var(--ink);
  }
  .titles p {
    margin: 0; font-size: .72rem; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase;
  }

  .mast-meta { margin-left: auto; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
  .meta-cell { display: flex; flex-direction: column; }
  .meta-cell .mk {
    font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
  }
  .meta-cell .mv {
    font-family: var(--mono); font-size: .8rem; color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .meta-cell[hidden] { display: none; }

  /* ---------- page shell ---------- */
  .page { max-width: 1280px; margin: 0 auto; padding: 1.5rem 1.75rem 5rem; }

  /* ---------- run panel ---------- */
  .runner {
    border: 1px solid var(--line); border-radius: var(--r); background: var(--white);
    overflow: hidden; margin-bottom: 1.5rem;
  }
  .runner-head {
    padding: .9rem 1.25rem; border-bottom: 1px solid var(--line); background: var(--panel-alt);
    display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap;
  }
  .runner-head h2 { margin: 0; font-size: .85rem; font-weight: 700; letter-spacing: .02em; }
  .runner-head span { font-size: .78rem; color: var(--ink-3); }
  .runner-body { padding: 1.15rem 1.25rem; }

  .form-row { display: flex; align-items: flex-end; gap: .85rem; flex-wrap: wrap; }
  .fld { display: flex; flex-direction: column; gap: .3rem; }
  .fld label {
    font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); font-weight: 600;
  }
  input[type=text] {
    font-family: var(--mono); font-size: .85rem; color: var(--ink);
    background: var(--white); border: 1px solid var(--line-firm); border-radius: var(--r);
    padding: .45rem .6rem; min-width: 17rem;
  }
  input[type=text]:focus { border-color: var(--primary); outline: 2px solid var(--primary-soft); outline-offset: 0; }

  button {
    font-family: var(--sans); font-size: .83rem; font-weight: 600; cursor: pointer;
    background: var(--primary); color: var(--white); border: 1px solid var(--primary);
    border-radius: var(--r); padding: .47rem 1.05rem;
  }
  button:hover:not(:disabled) { background: var(--primary-ink); border-color: var(--primary-ink); }
  button.quiet { background: var(--white); color: var(--primary); border-color: var(--line-firm); }
  button.quiet:hover:not(:disabled) { background: var(--primary-soft); border-color: var(--primary); }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .grow { flex: 1 1 auto; }

  .toggle-state { font-family: var(--mono); font-size: .76rem; }

  /* ---------- pipeline ---------- */
  .pipe { margin-top: 1.15rem; border-top: 1px solid var(--line); }
  .pipe[hidden] { display: none; }
  .step {
    display: grid; grid-template-columns: 1.5rem 1fr auto; align-items: baseline; gap: .8rem;
    padding: .5rem .25rem; border-bottom: 1px solid var(--line);
    color: var(--ink-3);
  }
  .step:last-child { border-bottom: 0; }
  .step .mk {
    font-family: var(--mono); font-size: .85rem; text-align: center; font-weight: 700;
  }
  .step .what { font-size: .84rem; }
  .step .what code { font-family: var(--mono); font-size: .9em; }
  .step .res {
    font-family: var(--mono); font-size: .78rem; text-align: right; font-variant-numeric: tabular-nums;
  }

  .step.active { color: var(--ink); }
  .step.active .mk { color: var(--primary); }
  .step.done { color: var(--ink); }
  .step.done .mk { color: var(--ok); }
  .step.done .res { color: var(--ink); font-weight: 600; }
  .step.halt { color: var(--ink); }
  .step.halt .mk, .step.halt .res { color: var(--warn); font-weight: 700; }
  .step.fail { color: var(--ink); }
  .step.fail .mk, .step.fail .res { color: var(--crit); font-weight: 700; }
  .step.skip { color: var(--ink-3); opacity: .55; }

  @keyframes blink { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
  .step.active .mk { animation: blink .95s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .step.active .mk { animation: none } }

  .result-bar {
    margin-top: 1.15rem; padding-top: 1rem; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  }
  .result-bar[hidden] { display: none; }
  .result-bar p { margin: 0; font-size: .85rem; }

  /* ---------- dashboard body: sidebar + content ---------- */
  .body-grid { display: grid; grid-template-columns: 206px 1fr; gap: 1.75rem; align-items: start; }
  .body-grid[hidden] { display: none; }
  @media (max-width: 860px) { .body-grid { grid-template-columns: 1fr; } }

  nav.side { position: sticky; top: 4.6rem; }
  @media (max-width: 860px) { nav.side { position: static; } }
  nav.side .navlabel {
    font-size: .62rem; letter-spacing: .11em; text-transform: uppercase; color: var(--ink-3);
    padding: 0 .7rem .5rem; font-weight: 600;
  }
  nav.side button {
    display: flex; align-items: center; gap: .5rem; width: 100%; text-align: left;
    background: transparent; color: var(--ink-2); border: 0; border-left: 3px solid transparent;
    border-radius: 0; padding: .48rem .7rem; font-size: .84rem; font-weight: 500;
  }
  nav.side button:hover { background: var(--panel); color: var(--ink); }
  nav.side button[aria-current="page"] {
    background: var(--panel); color: var(--ink); font-weight: 700; border-left-color: var(--brand);
  }
  nav.side .dot {
    width: 7px; height: 7px; border-radius: 50%; margin-left: auto; flex: 0 0 auto;
    background: var(--line-firm);
  }
  nav.side .dot.both { background: var(--ok); }
  nav.side .dot.one { background: var(--warn); }

  /* ---------- content blocks ---------- */
  .vh { margin: 0 0 .25rem; font-size: 1.1rem; font-weight: 700; letter-spacing: -.01em; }
  .vsub { margin: 0 0 1.5rem; font-size: .85rem; color: var(--ink-3); max-width: 76ch; }

  .sect { margin-top: 1.9rem; }
  .sect-h {
    display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap;
    margin: 0 0 .75rem; padding-bottom: .4rem; border-bottom: 1px solid var(--line);
  }
  .sect-h h3 { margin: 0; font-size: .85rem; font-weight: 700; letter-spacing: .01em; }
  .sect-h .note { font-size: .76rem; color: var(--ink-3); }

  /* stat strip */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit,minmax(142px,1fr)); gap: .75rem; margin-bottom: 1.35rem; }
  .tile { border: 1px solid var(--line); border-radius: var(--r); padding: .7rem .85rem; background: var(--white); }
  .tile .tk {
    font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
    display: block; margin-bottom: .2rem; font-weight: 600;
  }
  .tile .tv { font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .tile .tv.sm { font-size: .88rem; font-family: var(--mono); font-weight: 500; }
  .tile .tv.ok { color: var(--ok); } .tile .tv.warn { color: var(--warn); }
  .tile .of { color: var(--ink-3); font-size: .78rem; font-weight: 500; }

  /* pills */
  .pill {
    display: inline-flex; align-items: center; gap: .3rem;
    font-size: .68rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: .14rem .45rem; border-radius: 2px; border: 1px solid transparent;
  }
  .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: #CBE4D8; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: #EBD9BB; }
  .pill.crit { background: var(--crit-soft); color: var(--crit); border-color: #EFCFCC; }
  .pill.neutral { background: var(--panel); color: var(--ink-2); border-color: var(--line-firm); }
  .pill.ios { background: var(--primary-soft); color: var(--primary); border-color: #CBDCEA; }
  .pill.and { background: var(--ok-soft); color: var(--ok); border-color: #CBE4D8; }

  /* record cards */
  .duo { display: grid; grid-template-columns: repeat(auto-fit,minmax(330px,1fr)); gap: .9rem; }
  .panelbox { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-width: 0; background: var(--white); }
  .panelbox > header {
    padding: .55rem .8rem; background: var(--panel-alt); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  }
  .panelbox > header h4 {
    margin: 0; font-size: .68rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2);
  }
  pre {
    margin: 0; padding: .8rem; overflow-x: auto; white-space: pre;
    font-family: var(--mono); font-size: .735rem; line-height: 1.6; color: var(--ink-2);
    background: var(--white);
  }

  /* tables */
  .tbl { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .tbl-scroll { overflow-x: auto; max-height: 27rem; overflow-y: auto; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .79rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .45rem .75rem; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th {
    font-size: .62rem; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3);
    font-weight: 700; background: var(--panel); position: sticky; top: 0; z-index: 1;
    border-bottom: 1px solid var(--line-firm);
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--panel-alt); }
  td.m, th.m { font-family: var(--mono); }
  .r { text-align: right; }
  .agree { color: var(--ok); font-weight: 700; }
  .differ { color: var(--warn); font-weight: 700; }
  .nul { color: var(--ink-3); font-style: italic; }

  /* callouts */
  .call { border: 1px solid var(--line); border-left-width: 3px; border-radius: var(--r); padding: .8rem 1rem; margin-bottom: 1.2rem; font-size: .84rem; }
  .call.warn { background: var(--warn-soft); border-color: var(--line); border-left-color: var(--warn); }
  .call.crit { background: var(--crit-soft); border-color: var(--line); border-left-color: var(--crit); }
  .call.info { background: var(--primary-soft); border-color: var(--line); border-left-color: var(--primary); }
  .call.ok { background: var(--ok-soft); border-color: var(--line); border-left-color: var(--ok); }
  .call p { margin: 0 0 .5rem; } .call p:last-child { margin: 0; }
  .call strong { font-weight: 700; }
  code { font-family: var(--mono); font-size: .88em; }

  .none { color: var(--ink-3); font-size: .84rem; padding: 1.5rem 0; }

  footer.ft {
    max-width: 1280px; margin: 0 auto; padding: 1.1rem 1.75rem 2.5rem;
    border-top: 1px solid var(--line); color: var(--ink-3); font-size: .74rem; font-family: var(--mono);
  }
</style>
</head>
<body>

<div class="rail"></div>

<div class="masthead">
  <div class="masthead-in">
    <div class="lockup">
      <img id="logo" alt="UNSW" hidden>
      <div class="lockup-div" id="logoDiv" hidden></div>
      <div class="titles">
        <h1>Vital Sign Mapping Console</h1>
        <p>UNSW · cross-platform health data thesis</p>
      </div>
    </div>

    <div class="mast-meta">
      <div class="meta-cell" id="mcSubject" hidden>
        <span class="mk">Subject</span><span class="mv" id="mvSubject"></span>
      </div>
      <div class="meta-cell" id="mcRecords" hidden>
        <span class="mk">Records</span><span class="mv" id="mvRecords"></span>
      </div>
      <div class="meta-cell" id="mcSource" hidden>
        <span class="mk">Source</span><span class="mv" id="mvSource"></span>
      </div>
    </div>
  </div>
</div>

<div class="page">

  <section class="runner">
    <div class="runner-head">
      <h2>Mapping run</h2>
      <span>Reads the newest exports from the watched folder, runs each platform's mapper, validates against the schema.</span>
    </div>
    <div class="runner-body">
      <div class="form-row">
        <div class="fld">
          <label for="subject">Patient identifier to assign</label>
          <input type="text" id="subject" value="mrn-00123" spellcheck="false" autocomplete="off">
        </div>
        <button id="run">Run mapper</button>
        <span class="grow"></span>
        <button id="fixtures" class="quiet" aria-pressed="true">
          Android fixtures <span class="toggle-state">on</span>
        </button>
      </div>

      <div class="pipe" id="pipe" hidden></div>

      <div class="result-bar" id="resultBar" hidden>
        <p id="resultMsg"></p>
        <span class="grow"></span>
        <button id="toCompare">Open comparison</button>
      </div>
    </div>
  </section>

  <div class="body-grid" id="bodyGrid" hidden>
    <nav class="side" id="side"></nav>
    <div id="content"></div>
  </div>
</div>

<footer class="ft" id="ft"></footer>

<script>
const KINDS = ["heart_rate","spo2","hrv"];
const PLATFORMS = [["apple","Apple · HealthKit"],["android","Android · Health Connect"]];
const LABELS = { heart_rate:"Heart rate", spo2:"Blood oxygen", hrv:"Heart rate variability" };

let state = null, view = "sources", useFixtures = true, running = false;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const j = o => esc(JSON.stringify(o, null, 2));
const nn = v => v === null || v === undefined ? '<span class="nul">null</span>' : esc(v);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* Institutional logo is never bundled — it loads only if someone has put the
   official asset in demo/brand/. Otherwise the type lockup stands alone. */
(function loadLogo() {
  const img = $("#logo");
  img.onload = () => { img.hidden = false; $("#logoDiv").hidden = false; };
  img.onerror = () => { img.hidden = true; $("#logoDiv").hidden = true; };
  img.src = "/brand/logo";
})();

/* ------------------------------------------------------------------ *
 * staged run — two real requests (/api/scan, then /api/state), paced
 * so each step is readable during a demo. Numbers are real results;
 * only the reveal is slowed.
 * ------------------------------------------------------------------ */
const STEPS = [
  { id:"scan",     what:'Scan watched folder for exports' },
  { id:"identify", what:'Identify each file by record shape' },
  { id:"apple",    what:'Run <code>apple/mapper.py</code>' },
  { id:"android",  what:'Run <code>android/mapper.py</code>' },
  { id:"validate", what:'Validate against <code>vital_sign.schema.json</code>' },
  { id:"compare",  what:'Pair platforms for comparison' },
];
const MARKS = { done:"✓", fail:"✕", halt:"!", skip:"·" };
const PACE = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 120 : 620;

function renderPipe() {
  $("#pipe").hidden = false;
  $("#pipe").innerHTML = STEPS.map((s,i) =>
    `<div class="step" id="step-${s.id}">
       <span class="mk">${i+1}</span>
       <span class="what">${s.what}</span>
       <span class="res"></span>
     </div>`).join("");
}

function stepState(id, cls, res) {
  const el = $("#step-" + id);
  if (!el) return;
  const i = STEPS.findIndex(s => s.id === id) + 1;
  el.classList.remove("active","done","fail","halt","skip");
  if (cls) el.classList.add(cls);
  el.querySelector(".mk").textContent = MARKS[cls] || i;
  if (res !== undefined) el.querySelector(".res").innerHTML = res;
}

function skipRest(afterId) {
  const from = STEPS.findIndex(s => s.id === afterId) + 1;
  STEPS.slice(from).forEach(s => stepState(s.id, "skip", "—"));
}

async function step(id, work, format) {
  stepState(id, "active");
  await sleep(PACE);
  const out = await work();
  stepState(id, "done", format(out));
  return out;
}

async function run() {
  if (running) return;
  running = true;
  const subject = $("#subject").value.trim() || "mrn-00123";

  $("#run").disabled = true;
  $("#run").textContent = "Running…";
  $("#bodyGrid").hidden = true;
  $("#resultBar").hidden = true;
  $("#content").innerHTML = "";
  $("#ft").textContent = "";
  ["mcSubject","mcRecords","mcSource"].forEach(id => $("#" + id).hidden = true);
  renderPipe();

  try {
    const scan = await step("scan",
      async () => {
        const r = await fetch("/api/scan");
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || r.statusText);
        return d;
      },
      d => d.counts.files ? `${d.counts.files} file${d.counts.files === 1 ? "" : "s"}` : "none found");

    $("#mvSource").textContent = scan.folder.replace(/^\/Users\/[^/]+/, "~");
    $("#mcSource").hidden = false;

    if (scan.counts.files === 0) {
      stepState("scan", "halt", "none found");
      skipRest("scan");
      $("#bodyGrid").hidden = true;
      $("#content").innerHTML = "";
      $("#resultBar").hidden = true;
      $("#pipe").insertAdjacentHTML("afterend", `
        <div class="call warn" id="haltNote" style="margin-top:1.15rem">
          <p><strong>No exports in <code>${esc(scan.folder)}</code>.</strong>
             The run stopped at step 1 — there was nothing to map.</p>
          <p>Open HKBridge and tap <strong>Authorise</strong>. Then, in a <em>single app launch</em>:
             <strong>Write</strong> tab → Import Test Data, then <strong>Read</strong> tab → Read Samples →
             Save as JSON → AirDrop here. Reads filter on a session identifier that is regenerated every
             launch, so writing and reading cannot be split across restarts.</p>
          <p>Run again when a file has landed. Exports are recognised by record shape, so filenames
             do not matter.</p>
        </div>`);
      return;
    }

    await step("identify", async () => scan.counts,
      c => `${c.apple} Apple · ${c.android} Android`);

    const q = new URLSearchParams({ subject, fixtures: useFixtures ? "1" : "0" });
    let data = null;
    const mapAll = async () => {
      if (!data) {
        const r = await fetch("/api/state?" + q);
        data = await r.json();
        if (!r.ok) throw new Error(data.error || r.statusText);
      }
      return data;
    };

    await step("apple", mapAll, d => {
      const p = d.totals.by_platform.apple;
      return p.files ? `${p.raw} raw → ${p.canonical} records` : "no files";
    });
    await step("android", mapAll, d => {
      const p = d.totals.by_platform.android;
      return p.files ? `${p.raw} raw → ${p.canonical} records` : "no files";
    });
    await step("validate", mapAll, d =>
      d.totals.skipped
        ? `<span class="differ">${d.totals.canonical} valid · ${d.totals.skipped} skipped</span>`
        : `${d.totals.canonical} valid · 0 skipped`);
    await step("compare", mapAll, d => `${d.totals.paired} of 3 paired`);

    state = data;
    await sleep(PACE * 0.5);

    $("#mvSubject").textContent = state.subject;
    $("#mcSubject").hidden = false;
    $("#mvRecords").textContent = state.totals.canonical;
    $("#mcRecords").hidden = false;

    $("#resultMsg").innerHTML =
      `<span class="pill ok">complete</span> &nbsp;<strong>${state.totals.canonical}</strong> canonical
       records assigned to <code>${esc(state.subject)}</code>.`;
    $("#resultBar").hidden = false;
    $("#bodyGrid").hidden = false;
    view = "sources";
    render();
  } catch (e) {
    STEPS.forEach(s => {
      const el = $("#step-" + s.id);
      if (el && el.classList.contains("active")) stepState(s.id, "fail", esc(e.message));
    });
    $("#bodyGrid").hidden = false;
    $("#side").innerHTML = "";
    $("#content").innerHTML = `<div class="call crit"><p><strong>Run failed.</strong> ${esc(e.message)}</p></div>`;
  } finally {
    running = false;
    $("#run").disabled = false;
    $("#run").textContent = "Run mapper";
  }
}

/* ---------------- nav + shell ---------------- */
function renderSide() {
  const items = [["sources","Run summary"], ...KINDS.map(k => [k, LABELS[k]]), ["compare","Comparison"]];
  $("#side").innerHTML = `<p class="navlabel">Sections</p>` + items.map(([id,label]) => {
    let dot = "";
    if (KINDS.includes(id)) {
      const kd = state.kinds[id];
      const n = (kd.apple ? 1 : 0) + (kd.android ? 1 : 0);
      dot = `<span class="dot ${n === 2 ? "both" : n === 1 ? "one" : ""}"></span>`;
    }
    return `<button data-v="${id}" ${view === id ? 'aria-current="page"' : ""}>${esc(label)}${dot}</button>`;
  }).join("");
  $("#side").querySelectorAll("button").forEach(b =>
    b.onclick = () => { view = b.dataset.v; render(); });
}

function render() {
  renderSide();
  const t = state.totals;
  $("#ft").textContent =
    `${t.canonical} canonical records · ${t.files} source file(s) · ${t.skipped} skipped · `
    + `subject ${state.subject} · generated ${state.generated}`;
  if (view === "sources") viewSummary();
  else if (view === "compare") viewCompare();
  else viewKind(view);
}

/* ---------------- run summary ---------------- */
function viewSummary() {
  const t = state.totals, d = state.discovered;
  let h = `<h2 class="vh">Run summary</h2>
    <p class="vsub">Files are identified by the shape of their records, not their filename — both bridge
    applications name exports the same way. The newest file per platform and vital sign is the one mapped.</p>`;

  h += `<div class="tiles">
    <div class="tile"><span class="tk">Source files</span><span class="tv">${t.files}</span></div>
    <div class="tile"><span class="tk">Canonical records</span><span class="tv">${t.canonical}</span></div>
    <div class="tile"><span class="tk">Skipped</span><span class="tv ${t.skipped ? "warn" : "ok"}">${t.skipped}</span></div>
    <div class="tile"><span class="tk">Platforms</span><span class="tv sm">${t.platforms.join(" + ") || "—"}</span></div>
    <div class="tile"><span class="tk">Paired</span><span class="tv">${t.paired}<span class="of"> / 3</span></span></div>
    <div class="tile"><span class="tk">Subject</span><span class="tv sm">${esc(state.subject)}</span></div>
  </div>`;

  if (state.fixtures_used.length) {
    h += `<div class="call warn"><p><strong>Repository fixtures substituted for Android.</strong>
      No Health Connect export was found for
      ${state.fixtures_used.map(k => esc(LABELS[k].toLowerCase())).join(", ")},
      so <code>tests/fixtures/android/</code> stood in. These are synthetic test records, not device data.
      Anything drawn from them carries a <span class="pill warn">fixture</span> marker.</p></div>`;
  }
  if (state.errors.length) {
    h += `<div class="call crit"><p><strong>Read errors</strong></p>`
      + state.errors.map(e => `<p>${esc(e)}</p>`).join("") + `</div>`;
  }

  h += `<div class="sect"><div class="sect-h"><h3>Detected exports</h3>
    <span class="note">${d.length} recognised in ${esc(state.folder)}</span></div>`;
  if (!d.length) {
    h += `<p class="none">Nothing recognised in the watched folder.</p>`;
  } else {
    h += `<div class="tbl"><div class="tbl-scroll"><table><thead><tr>
      <th>Platform</th><th>Vital sign</th><th>File</th><th class="r">Raw records</th><th>Modified (UTC)</th>
      </tr></thead><tbody>`
      + d.map(f => `<tr>
        <td><span class="pill ${f.platform === "apple" ? "ios" : "and"}">${f.platform}</span></td>
        <td>${esc(LABELS[f.kind])}</td>
        <td class="m">${esc(f.filename)}</td>
        <td class="r">${f.raw_count}</td>
        <td class="m">${esc((f.modified || "").replace("T"," ").slice(0,19))}</td>
      </tr>`).join("") + `</tbody></table></div></div>`;
  }
  h += `</div>`;
  $("#content").innerHTML = h;
}

/* ---------------- one vital sign ---------------- */
function viewKind(kind) {
  const kd = state.kinds[kind];
  let h = `<h2 class="vh">${esc(kd.label)}</h2>
    <p class="vsub">Raw export beside canonical output — the same record before and after its platform's
    mapper ran.</p>`;

  for (const [p, title] of PLATFORMS) {
    const d = kd[p];
    h += `<div class="sect"><div class="sect-h"><h3>${esc(title)}</h3>`;
    if (!d) {
      h += `</div><p class="none">No ${p} export for ${esc(kd.label.toLowerCase())}.</p></div>`;
      continue;
    }
    h += `<span class="pill ${d.source === "fixture" ? "warn" : "neutral"}">${d.source === "fixture" ? "fixture" : "device export"}</span>
      <span class="note">${esc(d.filename)}</span></div>`;

    h += `<div class="tiles">
      <div class="tile"><span class="tk">Raw → canonical</span><span class="tv sm">${d.raw_count} → ${d.canonical_count}</span></div>
      <div class="tile"><span class="tk">Unit</span><span class="tv sm">${nn(d.unit)}</span></div>
      <div class="tile"><span class="tk">Method</span><span class="tv sm">${nn(d.method)}</span></div>
      <div class="tile"><span class="tk">Range</span><span class="tv sm">${d.value_min ?? "—"} – ${d.value_max ?? "—"}</span></div>
      <div class="tile"><span class="tk">Validation</span><span class="tv sm">${
        d.exit_code ? '<span class="pill crit">exit 1</span>' : '<span class="pill ok">exit 0</span>'}</span></div>
    </div>`;

    if (d.warnings.length) {
      h += `<div class="call warn"><p><strong>${d.skipped} record(s) skipped</strong></p>`
        + d.warnings.map(w => `<p class="m"><code>${esc(w)}</code></p>`).join("") + `</div>`;
    }

    h += `<div class="duo">
      <div class="panelbox"><header><h4>Raw export</h4></header><pre>${j(d.raw[0])}</pre></div>
      <div class="panelbox"><header><h4>Canonical record</h4></header><pre>${j(d.canonical[0])}</pre></div>
    </div>`;

    h += `<div class="sect"><div class="sect-h"><h3>All canonical records</h3>
      <span class="note">${d.canonical_count} record(s)</span></div>
      <div class="tbl"><div class="tbl-scroll"><table><thead><tr>
        <th class="r">#</th><th>Subject</th><th>Effective date/time</th><th class="r">Value</th><th>Unit</th>
        <th>Code</th><th>Method</th><th>Recording method</th><th>UUID</th>
      </tr></thead><tbody>`
      + d.canonical.map((r,i) => `<tr>
        <td class="r">${i+1}</td>
        <td class="m">${esc(r.subject)}</td>
        <td class="m">${esc(r.effectiveDateTime)}</td>
        <td class="r">${r.valueQuantity.value}</td>
        <td class="m">${esc(r.valueQuantity.unit)}</td>
        <td class="m">${esc(r.code)}</td>
        <td class="m">${nn(r.method)}</td>
        <td class="m">${nn(r.metadata.recordingMethod)}</td>
        <td class="m">${esc(String(r.metadata.uuid).slice(0,8))}…</td>
      </tr>`).join("") + `</tbody></table></div></div></div></div>`;
  }
  $("#content").innerHTML = h;
}

/* ---------------- comparison ---------------- */
function viewCompare() {
  let h = `<h2 class="vh">Platform comparison</h2>
    <p class="vsub">For each vital sign held by both platforms: whether the clinical fields agree, whether the
    record shape is identical, and where the data legitimately diverges.</p>`;

  const comparable = KINDS.filter(k => state.kinds[k].comparison);
  if (!comparable.length) {
    h += `<p class="none">Nothing to compare — a vital sign requires an export from both platforms.</p>`;
    $("#content").innerHTML = h; return;
  }

  for (const kind of comparable) {
    const kd = state.kinds[kind], c = kd.comparison;
    const realDiv = c.fields.filter(f => !f.agree && !f.expected);

    h += `<div class="sect"><div class="sect-h"><h3>${esc(kd.label)}</h3>
      <span class="note">${c.counts.apple} Apple · ${c.counts.android} Android</span>
      ${realDiv.length ? '<span class="pill warn">unexplained divergence</span>'
                       : '<span class="pill ok">converged</span>'}</div>`;

    h += `<div class="tiles">
      <div class="tile"><span class="tk">Record counts</span><span class="tv sm">${c.counts.apple} vs ${c.counts.android}</span></div>
      <div class="tile"><span class="tk">Top-level keys</span><span class="tv sm ${c.shape.top_level_identical ? "ok" : "warn"}">${c.shape.top_level_identical ? "identical" : "differ"}</span></div>
      <div class="tile"><span class="tk">Metadata keys</span><span class="tv sm ${c.shape.metadata_identical ? "ok" : "warn"}">${c.shape.metadata_identical ? "identical" : "differ"}</span></div>
      <div class="tile"><span class="tk">Field divergences</span><span class="tv">${c.divergences.length}</span></div>
    </div>`;

    h += `<div class="tbl"><table><thead><tr>
      <th>Clinical field</th><th>Apple · HealthKit</th><th>Android · Health Connect</th><th>Verdict</th>
      </tr></thead><tbody>`
      + c.fields.map(f => `<tr>
          <td class="m">${esc(f.field)}</td>
          <td class="m">${nn(f.apple)}</td>
          <td class="m">${nn(f.android)}</td>
          <td>${f.agree ? '<span class="agree">agree</span>'
                : f.expected ? '<span class="differ">differs — platform capability</span>'
                : '<span class="differ">differs</span>'}</td>
        </tr>`).join("") + `</tbody></table></div>`;

    if (kind === "hrv" && c.fields.some(f => f.field === "method" && !f.agree)) {
      h += `<div class="call warn" style="margin-top:1.2rem">
        <p><strong>Same code, same unit, different statistic.</strong> Both records carry
        <code>80404-7</code> and <code>ms</code>, and both validate — but the Apple figure is SDNN and the
        Android figure is RMSSD. Different formulas over the same heartbeats. These values are
        <strong>not numerically comparable</strong>, and <code>method</code> is the only field in the output
        that records the distinction.</p></div>`;
    }

    h += `<div class="sect"><div class="sect-h"><h3>Fields only one platform can answer</h3></div>
      <div class="tbl"><table><thead><tr>
      <th>Metadata field</th><th>Apple · HealthKit</th><th>Android · Health Connect</th>
      </tr></thead><tbody>`
      + c.nulls.map(n => `<tr>
        <td class="m">${esc(n.field)}</td>
        <td class="m">${nn(n.apple)}</td>
        <td class="m">${nn(n.android)}</td>
      </tr>`).join("") + `</tbody></table></div></div>`;

    if (!realDiv.length) {
      h += `<div class="call ok" style="margin-top:1.2rem"><p><strong>Converged.</strong> Every clinical field
        agrees except where a platform genuinely cannot match the other, the record shape is identical in both
        tiers, and the remaining differences are labelled rather than hidden.</p></div>`;
    }
    h += `</div>`;
  }
  $("#content").innerHTML = h;
}

/* ---------------- wiring ---------------- */
$("#run").onclick = run;
$("#subject").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
$("#toCompare").onclick = () => { view = "compare"; render(); };
$("#fixtures").onclick = () => {
  useFixtures = !useFixtures;
  $("#fixtures").querySelector(".toggle-state").textContent = useFixtures ? "on" : "off";
  $("#fixtures").setAttribute("aria-pressed", String(useFixtures));
};
$("#subject").focus();
$("#subject").select();
</script>
</body>
</html>
